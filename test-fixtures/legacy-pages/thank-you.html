<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card {
      background: linear-gradient(145deg, rgba(26, 18, 34, 0.7), rgba(15, 23, 42, 0.85));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .hero-header {
      text-align: center;
      padding: 10px 0 10px;
    }
    .check-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      border: 1.5px solid #10B981;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #10B981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
      margin-bottom: 20px;
    }
    .vip-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.3);
      color: #F472B6;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    .subhead {
      font-size: 14px;
      color: #94A3B8;
      max-width: 520px;
      margin: 0 auto;
    }
    .voucher-card {
      border: 1px dashed rgba(236, 72, 153, 0.45);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(15, 23, 42, 0.6));
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .voucher-code-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin: 14px 0;
    }
    .code-text {
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.1em;
    }
    .copy-btn {
      background: rgba(236, 72, 153, 0.25);
      border: 1px solid rgba(236, 72, 153, 0.5);
      color: #F472B6;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: rgba(236, 72, 153, 0.4);
      color: #FFFFFF;
    }
    .ritual-step {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ritual-step:last-child {
      border-bottom: none;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.3);
      color: #F472B6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .actions-grid { grid-template-columns: 1fr; }
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #EC4899, #DB2777);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      transition: transform 0.15s ease;
      text-align: center;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F1F5F9;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s ease;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card hero-header">
      <div class="check-icon">✓</div>
      <br>
      
      <h1>Thank you</h1>
      
    </div>

    

    

    
    <div class="actions-grid">
      <a href="https://shop.myshopify.com" target="_blank" rel="noopener" class="btn-primary">Back to the store</a>
      
    </div>

    <div style="text-align:center; padding:10px 0; font-size:11px; color:#64748B;">
      Powered by Jourvance
    </div>
  </div>
</body>
</html>
